<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{ pre_head }}<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  // A page already on its way elsewhere is a hop, not a visit, so it sends no
  // pageview. The slot above this tag is where a page sets the flag.
  if (!window.__redirecting) {
    gtag('js', new Date());
    gtag('config', '{{ ga_id }}', {content_group: '{{ content_group }}'});
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[data-app]');
    if (a) gtag('event', 'play_store_click', {app: a.dataset.app, link_url: a.href});
  });
</script>
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta name="author" content="Michael Orlov">
<meta property="og:site_name" content="Orlov Games">
<meta property="og:locale" content="en_GB">
{{ head }}
<!-- @alternates -->

<link rel="stylesheet" href="/style.css">
</head>
